<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Student Data</title>
</head>
<body>
    <h1>All Student Data</h1>
    {% if students %}
    {% for s in students %}
    <li>
        <a href="{% url 'student_details' s.id %}">{{s.name}} || {{s.age}} || {{s.email}}</a>
        <a href="{% url 'student_edit' s.id %}">Edit</a>
        <a href="{% url 'student_delete' s.id %}">Delete</a>
    </li>
    {% endfor %}

    {% else %}
    <p>No data to display</p>

    {% endif %}
    
</body>
</html>
