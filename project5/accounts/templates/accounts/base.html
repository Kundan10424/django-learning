<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Demo</title>
</head>
<body>

    {% if messages %}
        <ul>
            {% for m in messages %}
                <li>{{m}}</li>
            {% endfor %}
        </ul>
    {% endif %}
    {% if user.is_authenticated %}
        Hello👋🏻 {{user.username}} | <a href="{% url 'logout' %}">Logout</a>
        {% else %}
        <a href="{% url 'login'%}">Log In</a> | <a href="{% url 'register'%}">Register</a>
    {% endif %}
    
    <hr>
    {% block content %}
    {% endblock %}
</body>
</html>
